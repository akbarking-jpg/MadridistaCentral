<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madridista Central — A'zolar bo'yicha hududlar</title>
<meta name="description" content="O'zbekiston viloyatlari bo'yicha Madridista Central a'zolari">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --cyan:#00D4FF;--cyan-dim:rgba(0,212,255,0.12);--cyan-border:rgba(0,212,255,0.25);
  --purple:#B44FFF;--white:#fff;--black:#080810;--dark:#0D0D1A;--dark2:#13132A;
}
html{scroll-behavior:smooth;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--black);color:var(--white);min-height:100vh;}

nav{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:60px;background:rgba(8,8,16,0.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--cyan-border);position:sticky;top:0;z-index:100;}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-icon{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--cyan-border);}
.logo-text{font-size:13px;font-weight:700;color:var(--white);letter-spacing:1px;text-transform:uppercase;}
.logo-sub{font-size:9px;color:var(--cyan);letter-spacing:2px;text-transform:uppercase;display:block;}
.back-btn{font-size:12px;color:rgba(255,255,255,0.5);text-decoration:none;transition:color .2s;}
.back-btn:hover{color:var(--cyan);}

.page-hero{text-align:center;padding:2.5rem 2rem 2rem;background:radial-gradient(ellipse at 50% 0%,#0a0a2e 0%,transparent 70%);}
.badge{font-size:10px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;margin-bottom:0.75rem;display:block;}
.page-hero h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;letter-spacing:-1px;margin-bottom:0.5rem;}
.page-hero h1 span{color:var(--cyan);}
.page-hero p{font-size:13px;color:rgba(255,255,255,0.4);max-width:400px;margin:0 auto;}

.main{max-width:1000px;margin:0 auto;padding:2rem 1.5rem 4rem;}

.top-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;}
.ts{background:var(--dark2);border:1px solid var(--cyan-border);border-radius:10px;padding:12px;text-align:center;}
.ts-n{font-size:22px;font-weight:800;color:var(--cyan);text-shadow:0 0 15px rgba(0,212,255,0.3);}
.ts-l{font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:1px;text-transform:uppercase;margin-top:3px;}

.search-wrap{margin-bottom:1.25rem;}
.search-wrap input{width:100%;padding:10px 16px;font-size:13px;border-radius:8px;border:1px solid var(--cyan-border);background:var(--dark2);color:var(--white);outline:none;transition:border-color .2s;}
.search-wrap input:focus{border-color:var(--cyan);}
.search-wrap input::placeholder{color:rgba(255,255,255,0.2);}

.section-label{font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:2px;text-transform:uppercase;margin:1.25rem 0 0.75rem;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;}

.vcard{background:var(--dark2);border:1px solid var(--cyan-border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .2s;position:relative;}
.vcard:hover{border-color:var(--cyan);background:#1a1a35;}
.vcard.top1{border-color:var(--cyan);}
.vcard.top2{border-color:#00FF9F;}
.vcard.top3{border-color:#FFD700;}
.vcard.special{border-style:dashed;border-color:var(--purple);}
.vcard-rank{position:absolute;top:10px;right:12px;font-size:10px;font-weight:700;}
.vcard-rank.g{color:var(--cyan);}
.vcard-rank.s{color:#00FF9F;}
.vcard-rank.b{color:#FFD700;}
.vcard-rank.n{color:rgba(255,255,255,0.3);}
.vcard-name{font-size:13px;font-weight:600;color:var(--white);margin-bottom:3px;padding-right:28px;line-height:1.4;}
.vcard-type{font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:8px;}
.vcard-bar-wrap{height:3px;background:rgba(255,255,255,0.08);border-radius:2px;margin-bottom:8px;}
.vcard-bar{height:3px;border-radius:2px;}
.vcard-bar.top1{background:var(--cyan);}
.vcard-bar.top2{background:#00FF9F;}
.vcard-bar.top3{background:#FFD700;}
.vcard-bar.normal{background:rgba(255,255,255,0.25);}
.vcard-bar.special{background:var(--purple);}
.vcard-count{font-size:22px;font-weight:800;color:var(--white);}
.vcard-label{font-size:10px;color:rgba(255,255,255,0.3);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;align-items:center;justify-content:center;padding:1rem;}
.modal-overlay.open{display:flex;}
.modal{background:var(--dark2);border:1px solid var(--cyan-border);border-radius:12px;padding:1.5rem;max-width:360px;width:100%;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;gap:8px;}
.modal-title{font-size:15px;font-weight:700;color:var(--white);line-height:1.4;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:rgba(255,255,255,0.4);flex-shrink:0;}
.modal-type{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:1px;text-transform:uppercase;margin-bottom:0.75rem;}
.modal-count{font-size:2.5rem;font-weight:800;color:var(--cyan);text-shadow:0 0 20px rgba(0,212,255,0.3);}
.modal-sub{font-size:12px;color:rgba(255,255,255,0.3);margin-bottom:1rem;}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.mrow:last-child{border:none;}
.av{width:28px;height:28px;border-radius:50%;background:var(--cyan-dim);border:1px solid var(--cyan-border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--cyan);flex-shrink:0;}
.mn{font-size:13px;color:var(--white);}
.mid{font-size:10px;color:rgba(255,255,255,0.3);}
.jbtn{width:100%;margin-top:1rem;padding:11px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,var(--cyan),var(--purple));border:none;color:white;transition:opacity .2s;}
.jbtn:hover{opacity:0.9;}
.empty{text-align:center;padding:3rem;color:rgba(255,255,255,0.3);font-size:13px;}

@media(max-width:480px){
  nav{padding:0 1rem;}
  .main{padding:1.5rem 1rem 3rem;}
  .top-stats{gap:6px;}
  .ts-n{font-size:18px;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="logo.jpg" alt="Logo" class="logo-icon">
    <div>
      <span class="logo-text">Madridista Central</span>
      <span class="logo-sub">O'zbekiston</span>
    </div>
  </a>
  <a href="index.html" class="back-btn">← Bosh sahifa</a>
</nav>

<div class="page-hero">
  <span class="badge">Hududlar bo'yicha</span>
  <h1>A'zolar <span>xaritasi</span></h1>
  <p>O'zbekiston viloyatlari va Qoraqalpog'iston bo'yicha Madridistalar</p>
</div>

<div class="main">
  <div class="top-stats">
    <div class="ts"><div class="ts-n" id="total">127</div><div class="ts-l">Jami a'zo</div></div>
    <div class="ts"><div class="ts-n">13</div><div class="ts-l">Hudud</div></div>
    <div class="ts"><div class="ts-n">Samarqand</div><div class="ts-l">Eng ko'p</div></div>
  </div>

  <div class="search-wrap">
    <input type="text" placeholder="🔍 Hudud qidirish..." oninput="filter(this.value)">
  </div>

  <div id="content"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="m-title"></div>
      <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-type" id="m-type"></div>
    <div class="modal-count" id="m-count"></div>
    <div class="modal-sub">nafar Madridista</div>
    <div id="m-members"></div>
    <a href="member.html" class="jbtn">🤍 Siz ham a'zo bo'ling!</a>
  </div>
</div>

<script>
var data = [
  {name:"Samarqand viloyati", type:"Viloyat", count:22},
  {name:"Toshkent viloyati", type:"Viloyat", count:20},
  {name:"Farg'ona viloyati", type:"Viloyat", count:18},
  {name:"Andijon viloyati", type:"Viloyat", count:14},
  {name:"Namangan viloyati", type:"Viloyat", count:12},
  {name:"Qashqadaryo viloyati", type:"Viloyat", count:10},
  {name:"Buxoro viloyati", type:"Viloyat", count:9},
  {name:"Xorazm viloyati", type:"Viloyat", count:6},
  {name:"Surxondaryo viloyati", type:"Viloyat", count:5},
  {name:"Navoiy viloyati", type:"Viloyat", count:4},
  {name:"Jizzax viloyati", type:"Viloyat", count:2},
  {name:"Sirdaryo viloyati", type:"Viloyat", count:1},
  {name:"Qoraqalpog'iston Respublikasi", type:"Avtonom Respublika", count:7}
];

var mc = localStorage.getItem('mc_count');
if(mc) document.getElementById('total').textContent = mc;

var names=[['D','Dostonbek'],['J','Jasur'],['S','Sherzod'],['B','Bobur'],['K','Kamol'],['U','Ulugbek'],['M','Mirzo'],['A','Aziz']];
var max = Math.max.apply(null, data.map(function(r){return r.count;}));

function rankClass(i){return i===0?'top1':i===1?'top2':i===2?'top3':'';}
function rankLabel(i){return i===0?'#1':i===1?'#2':i===2?'#3':'#'+(i+1);}
function rankLC(i){return i===0?'g':i===1?'s':i===2?'b':'n';}
function barClass(r,i){return r.type!=='Viloyat'?'special':i===0?'top1':i===1?'top2':i===2?'top3':'normal';}

function makeCard(r){
  var i = data.indexOf(r);
  var rc = rankClass(i);
  var pct = Math.round((r.count/max)*100);
  var d = document.createElement('div');
  d.className = 'vcard'+(rc?' '+rc:'')+(r.type!=='Viloyat'?' special':'');
  d.innerHTML =
    '<div class="vcard-rank '+rankLC(i)+'">'+rankLabel(i)+'</div>'+
    '<div class="vcard-name">'+r.name+'</div>'+
    '<div class="vcard-type">'+r.type+'</div>'+
    '<div class="vcard-bar-wrap"><div class="vcard-bar '+barClass(r,i)+'" style="width:'+pct+'%"></div></div>'+
    '<div class="vcard-count">'+r.count+'</div>'+
    '<div class="vcard-label">a\'zo</div>';
  d.onclick = function(){ openModal(r,i); };
  return d;
}

function render(list){
  var c = document.getElementById('content');
  c.innerHTML = '';
  if(!list.length){ c.innerHTML='<div class="empty">Hudud topilmadi</div>'; return; }

  var vils = list.filter(function(r){return r.type==='Viloyat';});
  var reps = list.filter(function(r){return r.type!=='Viloyat';});

  if(vils.length){
    var l = document.createElement('div');
    l.className = 'section-label';
    l.textContent = 'Viloyatlar';
    c.appendChild(l);
    var g = document.createElement('div');
    g.className = 'grid';
    vils.forEach(function(r){ g.appendChild(makeCard(r)); });
    c.appendChild(g);
  }
  if(reps.length){
    var l2 = document.createElement('div');
    l2.className = 'section-label';
    l2.textContent = 'Respublika';
    c.appendChild(l2);
    var g2 = document.createElement('div');
    g2.className = 'grid';
    reps.forEach(function(r){ g2.appendChild(makeCard(r)); });
    c.appendChild(g2);
  }
}

function filter(q){
  var f = q.toLowerCase();
  render(data.filter(function(r){ return r.name.toLowerCase().indexOf(f)>-1; }));
}

function openModal(r,i){
  document.getElementById('m-title').textContent = r.name;
  document.getElementById('m-type').textContent = r.type;
  document.getElementById('m-count').textContent = r.count;
  var mm = document.getElementById('m-members'); mm.innerHTML='';
  var show = Math.min(r.count,5);
  for(var j=0;j<show;j++){
    var n=names[j%names.length];
    mm.innerHTML+='<div class="mrow"><div class="av">'+n[0]+'</div><div><div class="mn">'+n[1]+'</div><div class="mid">MC-'+String(j+1).padStart(4,'0')+'</div></div></div>';
  }
  if(r.count>5) mm.innerHTML+='<div style="font-size:11px;color:rgba(255,255,255,0.3);padding:6px 0 0">va yana '+(r.count-5)+' nafar...</div>';
  document.getElementById('modal').classList.add('open');
}

function closeModal(e){ if(e.target===document.getElementById('modal')) document.getElementById('modal').classList.remove('open'); }

render(data);
</script>
</body>
</html>
